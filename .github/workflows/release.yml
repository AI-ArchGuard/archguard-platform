name: Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify release candidate
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify
          sha256sum target/archguard-platform-0.3.0.jar > target/archguard-platform-0.3.0.jar.sha256
          sha256sum openapi/platform-v1.yaml > openapi/platform-v1.yaml.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/archguard-platform-0.3.0.jar \
            target/archguard-platform-0.3.0.jar.sha256 \
            openapi/platform-v1.yaml \
            openapi/platform-v1.yaml.sha256 \
            --verify-tag \
            --title "ArchGuard Platform $GITHUB_REF_NAME" \
            --generate-notes

openapi: 3.1.0
info:
  title: ArchGuard Platform API
  version: 1.1.0-m2
  description: Project lifecycle and member management secured by an OIDC JWT resource server.
servers:
  - url: /
security:
  - platformIdentity: []
paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects visible to the caller
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of projects for which the caller is a member
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project and make the caller its maintainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Get a project visible to the caller
      responses:
        '200':
          description: Project found and caller is a member
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      operationId: updateProject
      summary: Update a project name as a maintainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated and its version incremented
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteProject
      summary: Delete a project and its memberships as a maintainer
      parameters:
        - name: version
          in: query
          required: true
          description: Expected project version for optimistic concurrency
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: Project and memberships deleted; audit records are retained
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectMembers
      summary: List members of a project visible to the caller
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of project members
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{projectId}/members/{actorId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: actorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setProjectMember
      summary: Add a member or replace its role as a maintainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectMemberRequest'
      responses:
        '200':
          description: Membership was created or updated
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeProjectMember
      summary: Remove a member as a maintainer
      responses:
        '204':
          description: Membership removed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project is hidden from the caller or the member does not exist
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    platformIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT with a UUID sub, the configured audience, and permissions in scope/scp.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestId:
      description: Lowercase 32-character hexadecimal request correlation identifier
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  responses:
    BadRequest:
      description: Invalid or malformed request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: OIDC bearer token is missing or invalid
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller is a member but lacks the required role or permission
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProjectNotFound:
      description: Project does not exist or is not visible to the caller
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Unique key, optimistic version, or last-maintainer invariant conflict
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,62}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        version:
          type: integer
          format: int64
          minimum: 0
    SetProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, createdBy, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    ProjectMember:
      type: object
      additionalProperties: false
      required: [actorId, role, createdAt]
      properties:
        actorId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
        createdAt:
          type: string
          format: date-time
    ProjectMemberRole:
      type: string
      enum: [MAINTAINER, VIEWER]
    ProjectMemberPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, details]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        details:
          type: object
          additionalProperties: true
